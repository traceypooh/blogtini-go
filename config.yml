# Your site's settings.  (YAML -- and this is a comment.)
# More settings, & what they do: https://blogtini.com/docs/

title: My blogtini

# Your live site's address: automatic -- from your repo's name (eg: https://YOU.github.io/REPO/),
# or your own domain's CNAME file.  Set it only if neither fits, ending w/ /, eg:
# site_url: https://example.com/blog/

# Your theme -- see them all, live: https://blogtini.com/themes/
#   future-imperfect (default), editorial, massively, phantom, striped, forty, strata, helios,
#   strongly-typed, hyperspace, librarian, terminal, dossier, cosmos, grid
# Or see *your* site in each one: open your site's /preview/
theme: future-imperfect

posts_per_page: 10

# your picture -- for sidebars, "about" bits & link previews.  Swap in your own `img/profile.jpg`
img_site: img/profile.jpg

# a banner atop future-imperfect's intro -- uncomment to show blogtini's, or swap in your own image
# site_header: img/blogtini.png

menu:
  main:
    - name: Home
      url: /
      pre: <i class='fa fa-home'></i>
    - name: About
      url: /about/
      pre: <i class='far fa-id-card'></i>
    - name: Categories
      url: /?categories
      pre: <i class='fas fa-sitemap'></i>
    - name: Contact
      url: /?contact
      pre: <i class='far fa-envelope'></i>

sidebar:
  about: Hi!  This is my brand new blog.  (Change this in config.yml)

# (future-imperfect: show your social links' icons -- & RSS -- atop the sidebar, & in the footer)
intro:
  rss: true
  social: true
footer:
  rss: true
  social: true

# Your social links -- as icons, in your theme.  Replace these examples w/ yours, or delete them.
# More: twitter, youtube, instagram, linkedin, facebook, flickr, strava, codepen, gitlab, ... & email
social:
  rss: index.xml
  github: traceypooh/blogtini        # eg: YOU (your profile) -- or YOU/REPO
  mastodon: mastodon.social/@Mastodon # eg: mastodon.social/@YOU

# The Contact page (/?contact) sends you email -- via a free form service, eg: https://formspree.io
# Sign up, make a form, & put its url here:
contact:
  email_service: https://formspree.io/f/YOUR-FORM-ID

# Comments: each one arrives as a pull request on your repo -- see https://blogtini.com/docs/#comments
# staticman:
#   enabled: true
#   api: blogtini.netlify.app
#   branch: main
